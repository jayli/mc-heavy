<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mc-heavy</title>
  <link rel="icon" type="image/png" href="./assets/ui/icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app-canvas { display: block; width: 100%; height: 100%; }
    /*
     * 启动 loading 占位（v2.51，素材同 mc-lite `src/style/Minecraft-Logo.png`）。
     *
     * **必须是静态 HTML + CSS，不能由 JS 创建**：它的存在意义就是「JS 还没解析/尚未跑完时也有画面」
     * —— 由 `src/main.js` 创建的话，页面在模块加载期间仍是一片黑，占位图完全失效。
     * 隐藏同样由 `src/main.js` 在 `rendererReady` 后做（见那里的注释）。
     *
     * 层级 = 95，插在 **toast 90 < loading 95 < 启动错误遮罩 100** 之间：
     *   · 高于 toast：启动期没有任何 toast，取中间值即可，不与任何模态争位；
     *   · 低于错误遮罩：WebGPU gate 失败时错误遮罩必须盖在最上面（那是「游戏根本没起来」）。
     * ⚠️ 改这个值必须同步 AGENTS.md 的层级不等式表。
     * `pointer-events: auto` 是有意的：启动期要挡住一切点击，避免玩家在 loading 上误触画布
     * 触发 pointer lock。
     */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 95;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0d0f14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8e8e8; transition: opacity 0.25s ease-out;
    }
    #loading-overlay.mc-loading-done { opacity: 0; pointer-events: none; }
    #loading-overlay .mc-loading-logo {
      width: min(520px, 80vw); height: auto; image-rendering: pixelated;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    #loading-overlay .mc-loading-spinner {
      width: 42px; height: 42px; border: 4px solid #3a3f4b;
      border-top-color: #7fc253; border-radius: 50%;
      animation: mc-loading-spin 0.9s linear infinite;
    }
    @keyframes mc-loading-spin { to { transform: rotate(360deg); } }
    #loading-overlay .mc-loading-text {
      margin: 0; font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #loading-overlay .mc-loading-sub { margin: 0; font-size: 12px; color: #9aa3b2; min-height: 16px; }
    /*
     * 进度条（v2.99）。三阶段合成一个总百分比，见 `src/core/load-progress.js`。
     * ⚠️ `transition` 只在 `width` 上：进度由 100ms 的 setInterval 驱动，转场太慢会追不上采样。
     */
    #loading-overlay .mc-loading-bar {
      width: min(420px, 72vw); height: 8px; border-radius: 4px;
      background: #262b36; overflow: hidden;
    }
    #loading-overlay .mc-loading-bar-fill {
      height: 100%; width: 0%; background: #7fc253; border-radius: 4px;
      transition: width 0.2s linear;
    }
    #loading-overlay .mc-loading-stat {
      margin: 0; font-size: 11px; color: #6f7887; min-height: 15px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* stall 面板：默认 hidden（CSS 也钉一次，防 `hidden` 属性被 display:flex 盖掉） */
    #loading-overlay .mc-loading-actions { display: flex; gap: 10px; }
    #loading-overlay .mc-loading-actions[hidden] { display: none; }
    #loading-overlay .mc-loading-actions button {
      padding: 6px 14px; font-size: 13px; border-radius: 4px; cursor: pointer;
      border: 1px solid #4a5160; background: #2b3140; color: #e8e8e8;
      font-family: inherit;
    }
    #loading-overlay .mc-loading-actions button:hover { background: #363d4e; }
    /*
     * 准心由 `src/ui/crosshair.js` 在运行时创建并挂到 body 下（v1.64）：
     * 它需要按准心背后的画面亮度在白色/黑色之间切色（固定白在雪地/白墙上会消失）。
     * 结构、样式与采样逻辑的唯一权威在那个模块，这里不再保留 DOM 占位。
     */
    #webgpu-error {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #1a1a2e; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      align-items: center; justify-content: center; text-align: center;
      line-height: 1.8; padding: 24px;
    }
  </style>
  <script>
    /*
     * 启动进度采集器（v2.99）—— **必须在 index.html 内联，不能放 src/main.js**。
     *
     * main.js 自身是模块图的根：它执行时首页 151 个模块请求（加上 14 个 Worker 各自 52 个，
     * 合计 874 个）已经全部挂出去了。由 JS 创建的采集器会漏掉最关键的一段，进度条从 0
     * 开始跳得很晚。这与 v2.51 把 loading 占位图写成静态 HTML 是同一条理由。
     *
     * ⚠️ **用 PerformanceObserver 而不是 performance.getEntriesByType()**：后者受资源
     * 时间线缓冲区上限截断（本仓实测只返 250 条，而实际 874 个模块请求）→ 进度条会在 30%
     * 处永久冻住。PerformanceObserver 的回调是增量推送，不受缓冲区限制。
     *
     * ⚠️ **刷新由 setInterval 驱动，不用 requestAnimationFrame**：后台标签页里 rAF 会停摆，
     * 玩家切走再切回来会看到一个冻住的进度条（看起来像卡死）。
     *
     * 只做采集，不做展示：百分比怎么算、阶段怎么切、什么时候算卡住，全在 `src/core/`
     * 的两个模块里（可单测）。这里暴露一个纯数据对象 + 一个回调槽。
     */
    (function () {
      var t0 = performance.now();
      var onChange = null;
      var state = {
        js: 0,          // 已完成的 .js/.mjs 资源条目数
        other: 0,       // 其它资源（png/json/audio/mp3/ogg…）
        total: 0,       // = js + other
        /** 自本脚本执行起的毫秒数（只读；不给 P1 进度用，仅供诊断/测试） */
        get sinceMs() { return performance.now() - t0; },
        /** UI 层注册的回调（单槽）。采集器出错时不会因它抛而中断启动。 */
        get onChange() { return onChange; },
        set onChange(fn) { onChange = typeof fn === 'function' ? fn : null; },
      };
      function count(name) {
        state.total++;
        if (/\.(js|mjs)(\?|$)/.test(name)) state.js++;
        else state.other++;
        if (onChange) { try { onChange(state); } catch (e) { /* 观察者出错不得打断启动 */ } }
      }
      try {
        new PerformanceObserver(function (list) {
          var es = list.getEntries();
          for (var i = 0; i < es.length; i++) count(es[i].name);
        }).observe({ type: 'resource' });
      } catch (e) {
        // 老浏览器没有 resource 观测：进度会停在 0，但启动不受影响
      }
      window.__MC_LOADING__ = state;
      // 兜底 tick：即便没有新资源也保证 sinceMs 与 UI 有东西可读（100ms 与 UI 刷新同频）
      setInterval(function () {
        if (onChange) { try { onChange(state); } catch (e) {} }
      }, 100);
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.webgpu.js",
      "three/tsl": "./vendor/three/three.tsl.js",
      "three/webgpu": "./vendor/three/three.webgpu.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <!-- 启动 loading 占位：静态节点 + 内联采集器，见 <head> 里的注释 -->
  <div id="loading-overlay">
    <img class="mc-loading-logo" src="./assets/ui/Minecraft-Logo.png" alt="Minecraft Logo">
    <div class="mc-loading-spinner"></div>
    <p class="mc-loading-text" id="loading-text">Loading</p>
    <p class="mc-loading-sub" id="loading-sub">正在加载资源…</p>
    <div class="mc-loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="0" aria-label="加载进度" id="loading-bar">
      <div class="mc-loading-bar-fill" id="loading-bar-fill"></div>
    </div>
    <p class="mc-loading-stat" id="loading-stat"></p>
    <div class="mc-loading-actions" id="loading-actions" hidden>
      <button type="button" id="loading-continue">继续等待</button>
      <button type="button" id="loading-reload">重新加载页面</button>
    </div>
  </div>
  <div id="webgpu-error">
    <div>
      <h2>无法启动渲染</h2>
      <p id="webgpu-error-detail">mc-heavy 使用 WebGPU 渲染，当前浏览器不支持。</p>
      <p id="webgpu-error-note">请使用最新版 Chrome / Edge / Safari 26，并通过 <code>http://localhost:8081</code> 或 HTTPS 地址打开（WebGPU 仅在安全上下文可用，局域网 IP 的 http 地址不行）。</p>
    </div>
  </div>
  <div id="hud-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
