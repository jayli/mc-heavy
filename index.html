<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mc-heavy</title>
  <link rel="icon" type="image/png" href="./assets/ui/icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app-canvas { display: block; width: 100%; height: 100%; }
    /*
     * 启动 loading 占位（v2.51，素材同 mc-lite `src/style/Minecraft-Logo.png`）。
     *
     * **必须是静态 HTML + CSS，不能由 JS 创建**：它的存在意义就是「JS 还没解析/尚未跑完时也有画面」
     * —— 由 `src/main.js` 创建的话，页面在模块加载期间仍是一片黑，占位图完全失效。
     * 隐藏同样由 `src/main.js` 在 `rendererReady` 后做（见那里的注释）。
     *
     * 层级 = 95，插在 **toast 90 < loading 95 < 启动错误遮罩 100** 之间：
     *   · 高于 toast：启动期没有任何 toast，取中间值即可，不与任何模态争位；
     *   · 低于错误遮罩：WebGPU gate 失败时错误遮罩必须盖在最上面（那是「游戏根本没起来」）。
     * ⚠️ 改这个值必须同步 AGENTS.md 的层级不等式表。
     * `pointer-events: auto` 是有意的：启动期要挡住一切点击，避免玩家在 loading 上误触画布
     * 触发 pointer lock。
     */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 95;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0d0f14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8e8e8; transition: opacity 0.25s ease-out;
    }
    #loading-overlay.mc-loading-done { opacity: 0; pointer-events: none; }
    #loading-overlay .mc-loading-logo {
      width: min(520px, 80vw); height: auto; image-rendering: pixelated;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    #loading-overlay .mc-loading-spinner {
      width: 42px; height: 42px; border: 4px solid #3a3f4b;
      border-top-color: #7fc253; border-radius: 50%;
      animation: mc-loading-spin 0.9s linear infinite;
    }
    @keyframes mc-loading-spin { to { transform: rotate(360deg); } }
    #loading-overlay .mc-loading-text {
      margin: 0; font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #loading-overlay .mc-loading-sub { margin: 0; font-size: 12px; color: #9aa3b2; min-height: 16px; }
    /*
     * 准心由 `src/ui/crosshair.js` 在运行时创建并挂到 body 下（v1.64）：
     * 它需要按准心背后的画面亮度在白色/黑色之间切色（固定白在雪地/白墙上会消失）。
     * 结构、样式与采样逻辑的唯一权威在那个模块，这里不再保留 DOM 占位。
     */
    #webgpu-error {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #1a1a2e; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      align-items: center; justify-content: center; text-align: center;
      line-height: 1.8; padding: 24px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.webgpu.js",
      "three/tsl": "./vendor/three/three.tsl.js",
      "three/webgpu": "./vendor/three/three.webgpu.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <!-- 启动 loading 占位：静态节点，见 <head> 里的注释 -->
  <div id="loading-overlay">
    <img class="mc-loading-logo" src="./assets/ui/Minecraft-Logo.png" alt="Minecraft Logo">
    <div class="mc-loading-spinner"></div>
    <p class="mc-loading-text">Loading</p>
    <p class="mc-loading-sub" id="loading-sub">正在加载资源…</p>
  </div>
  <div id="webgpu-error">
    <div>
      <h2>无法启动渲染</h2>
      <p id="webgpu-error-detail">mc-heavy 使用 WebGPU 渲染，当前浏览器不支持。</p>
      <p id="webgpu-error-note">请使用最新版 Chrome / Edge / Safari 26，并通过 <code>http://localhost:8081</code> 或 HTTPS 地址打开（WebGPU 仅在安全上下文可用，局域网 IP 的 http 地址不行）。</p>
    </div>
  </div>
  <div id="hud-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
