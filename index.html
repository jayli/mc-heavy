<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mc-heavy</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app-canvas { display: block; width: 100%; height: 100%; }
    /* 准心（mc-lite #crosshair 同规格：20×20 白色十字，difference 混合，不拦截输入） */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M10 0v20M0 10h20" stroke="white" stroke-width="2" style="mix-blend-mode:difference;"/></svg>') no-repeat center;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #webgpu-error {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #1a1a2e; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      align-items: center; justify-content: center; text-align: center;
      line-height: 1.8; padding: 24px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.webgpu.js",
      "three/tsl": "./vendor/three/three.tsl.js",
      "three/webgpu": "./vendor/three/three.webgpu.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <div id="crosshair"></div>
  <div id="webgpu-error">
    <div>
      <h2>无法启动渲染</h2>
      <p id="webgpu-error-detail">mc-heavy 使用 WebGPU 渲染，当前浏览器不支持。</p>
      <p>请使用最新版 Chrome / Edge / Safari 26，并通过 <code>http://localhost:8081</code> 或 HTTPS 地址打开（WebGPU 仅在安全上下文可用，局域网 IP 的 http 地址不行）。</p>
    </div>
  </div>
  <div id="hud-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
