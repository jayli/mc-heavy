      document.getElementById('report').textContent =
        `passed=${r.passed} failed=${r.failed} total=${r.total} passRate=${r.passRate}%`;
    }).catch((err) => {
      // 分档参数失配时 runAndExpose 会抛（并写 selectionError）——
      // 不接住的话页面只剩一个未处理 rejection，报错看不出是配置拼错。
      document.getElementById('report').textContent = `分档参数错误：${err && err.message || err}`;
