<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>mc-heavy 测试</title>
  <link rel="icon" href="data:,">
  <!--
    import map：M6 起 `test-zombies.js` 需在浏览器内构造受控渲染器（InstancedMesh 容量/几何/矩阵
    断言），故引入 three。其余单测全部相对路径 import、无 three 依赖 —— 加 map 对它们是 no-op。
    被测的**同构层模块**（voxel/gen/mesh/entities/workers）仍不得 import three，
    `npm run check:arch` 静态门守（红线 8/10）。
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/three.webgpu.js",
      "three/tsl": "../../vendor/three/three.tsl.js",
      "three/webgpu": "../../vendor/three/three.webgpu.js",
      "three/addons/": "../../vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <pre id="report"></pre>
  <script type="module">
    import { runAndExpose } from './runner.js';
    // 测试文件在此逐个 import（后续任务追加）
    import './test-smoke.js';
    import './test-perf.js';
    import './test-player-input.js';
    import './test-block-registry.js';
    import './test-chunk-column.js';
    import './test-terrain.js';
    import './test-lighting.js';
    import './test-light-writeback.js';
    import './test-mesher.js';
    import './test-physics.js';
    import './test-raycast.js';
    import './test-place-ray.js';
    import './test-player-place.js';
    import './test-step-lift.js';
    import './test-structure-layout.js';
    import './test-landmarks.js';
    import './test-structure-json.js';
    import './test-vegetation.js';
    import './test-scatter.js';
    import './test-giant-trees.js';
    import './test-giant-trees-column.js';
    import './test-giant-trees-gen.js';
    import './test-azalea-trees.js';
    import './test-azalea-trees-gen.js';
    import './test-giant-pyramid.js';
    import './test-giant-pyramid-gen.js';
    import './test-arena.js';
    import './test-arena-gen.js';
    import './test-shallow-water-tarns.js';
    import './test-shallow-water-bridge.js';
    import './test-shallow-tarn-gen.js';
    import './test-medieval-ship.js';
    import './test-tarn-zone.js';
    import './test-tarn-terrain.js';
    import './test-tarn-zone-gen.js';
    // 高台地带祭坛（v2.30）：离 City 最近地带圆心的地表图案 + 中心神龛
    import './test-tarn-altar.js';
    import './test-caves.js';
    import './test-daynight.js';
    import './test-sun-shade.js';
    import './test-hemi.js';
    import './test-fog-sky-direction.js';
    import './test-resource-url.js';
    import './test-sky-structures.js';
    import './test-budget.js';
    import './test-rain.js';
    import './test-ui.js';
    import './test-inventory.js';
    import './test-inventory-ui.js';
    import './test-orientation.js';
    import './test-iso-icon.js';
    import './test-world-editor.js';
    import './test-weapons.js';
    import './test-entity-manager.js';
    import './test-zombies.js';
    import './test-zombie-model.js';
    import './test-zombie-nests.js';
    import './test-zombie-pathfinder.js';
    import './test-explosion.js';
    import './test-explosion-sprite.js';
    import './test-turrets.js';
    import './test-projectiles.js';
    import './test-playground.js';
    import './test-minecarts.js';
    import './test-ocean-mask.js';
    import './test-progress.js';
    import './test-shadow-manager.js';
    import './test-bgm.js';
    import './test-view-bob.js';
    // 枪击命中特效（v1.66 落地 / v1.67 收敛为白闪 + 碎块）
    import './test-block-hit-fx.js';
    import './test-block-color.js';
    // 左下角迷你区域地图（v2.8）：区域分类纯函数
    import './test-minimap.js';
    // 渲染分辨率档位（v2.27）：清晰 / 性能 两档 → 像素比换算
    import './test-pixel-ratio.js';
    // 祭坛飞龙（v2.41）：烘焙产物契约（骨骼 / 几何 / 动画重采样）
    import './test-dragon-bake.js';
    // 祭坛飞龙（v2.41）：轨道/动画/AABB/definition/service 纯逻辑
    import './test-dragon-system.js';
    // 祭坛飞龙（v2.41）：渲染层（骨骼层级 / 动画采样 / visible 门控 / 红闪）
    import './test-dragon-render.js';
    // 飞龙机头朝向（v2.47）：前向 / 局部旋转 / 嘴部偏移的**唯一权威**
    import './test-dragon-facing.js';
    // Boss 召唤框架（v2.43）：地图判定 + 名册
    import './test-boss-map.js';
    // Boss 智能体抽象基类（v2.44）
    import './test-boss-agent.js';
    // 飞龙 Boss 智能体四态机（v2.44）
    import './test-dragon-boss-agent.js';
    // 焰魔（v2.55）：Molang 子集求值器（烘焙期待机动画的表达式）
    import './test-molang.js';
    // 焰魔（v2.55）：烘焙产物契约（骨骼层级 / UV / inflate / mirror / 动画帧数）
    import './test-ignis-bake.js';
    // 焰魔（v2.55）：碰撞/绕行判据参数化（丧尸零回归守门）
    import './test-ignis-collision.js';
    // 焰魔（v2.55）：实体定义 + service（create 校验 / 召唤幂等 / 死亡即消失）
    import './test-ignis-system.js';
    // 焰魔（v2.55）：地面三态机 AI（重力/step-up/命中帧攻击意图）
    import './test-ignis-boss-agent.js';
    // 焰魔（v2.55）：渲染器（池 2 / 脚底补偿 / idle↔attack 动画选择）
    import './test-ignis-render.js';
    // 飞龙火球（v2.44）：推进 / DDA 阻挡 / 玩家命中
    import './test-fireball.js';
    // 飞龙火球渲染池（v2.44）：容量派生 / visible 门控 / 差集驱动 slot
    import './test-fireball-render.js';
    // 玩家血心（生命系统显示层）：血量 → 10 颗心形态的纯函数契约
    import './test-health.js';

    runAndExpose().then((r) => {
      document.getElementById('report').textContent =
        `passed=${r.passed} failed=${r.failed} total=${r.total} passRate=${r.passRate}%`;
    });
  </script>
</body>
</html>
