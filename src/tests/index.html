<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>mc-heavy 测试</title>
  <link rel="icon" href="data:,">
  <!--
    import map：M6 起 `test-zombies.js` 需在浏览器内构造受控渲染器（InstancedMesh 容量/几何/矩阵
    断言），故引入 three。其余单测全部相对路径 import、无 three 依赖 —— 加 map 对它们是 no-op。
    被测的**同构层模块**（voxel/gen/mesh/entities/workers）仍不得 import three，
    `npm run check:arch` 静态门守（红线 8/10）。
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.webgpu.js",
      "three/tsl": "/vendor/three/three.tsl.js",
      "three/webgpu": "/vendor/three/three.webgpu.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <pre id="report"></pre>
  <script type="module">
    import { runAndExpose } from './runner.js';
    // 测试文件在此逐个 import（后续任务追加）
    import './test-smoke.js';
    import './test-perf.js';
    import './test-block-registry.js';
    import './test-chunk-column.js';
    import './test-terrain.js';
    import './test-lighting.js';
    import './test-light-writeback.js';
    import './test-mesher.js';
    import './test-physics.js';
    import './test-raycast.js';
    import './test-step-lift.js';
    import './test-structure-layout.js';
    import './test-landmarks.js';
    import './test-structure-json.js';
    import './test-vegetation.js';
    import './test-scatter.js';
    import './test-caves.js';
    import './test-daynight.js';
    import './test-sun-shade.js';
    import './test-fog-sky-direction.js';
    import './test-sky-structures.js';
    import './test-budget.js';
    import './test-rain.js';
    import './test-ui.js';
    import './test-inventory.js';
    import './test-inventory-ui.js';
    import './test-orientation.js';
    import './test-iso-icon.js';
    import './test-world-editor.js';
    import './test-weapons.js';
    import './test-entity-manager.js';
    import './test-zombies.js';
    import './test-zombie-nests.js';
    import './test-explosion.js';
    import './test-explosion-sprite.js';
    import './test-turrets.js';
    import './test-projectiles.js';
    import './test-playground.js';
    import './test-minecarts.js';
    import './test-ocean-mask.js';
    import './test-progress.js';
    import './test-shadow-manager.js';
    import './test-view-bob.js';

    runAndExpose().then((r) => {
      document.getElementById('report').textContent =
        `passed=${r.passed} failed=${r.failed} total=${r.total} passRate=${r.passRate}%`;
    });
  </script>
</body>
</html>
