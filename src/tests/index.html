<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>mc-heavy 测试</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <pre id="report"></pre>
  <script type="module">
    import { runAndExpose } from './runner.js';
    // 测试文件在此逐个 import（后续任务追加）
    import './test-smoke.js';
    import './test-perf.js';
    import './test-block-registry.js';
    import './test-chunk-column.js';
    import './test-terrain.js';
    import './test-lighting.js';
    import './test-light-writeback.js';
    import './test-mesher.js';
    import './test-physics.js';
    import './test-raycast.js';
    import './test-step-lift.js';
    import './test-structure-layout.js';
    import './test-landmarks.js';
    import './test-structure-json.js';
    import './test-vegetation.js';
    import './test-caves.js';
    import './test-daynight.js';
    import './test-sky-structures.js';
    import './test-budget.js';
    import './test-rain.js';
    import './test-ui.js';
    import './test-inventory.js';
    import './test-inventory-ui.js';
    import './test-orientation.js';
    import './test-iso-icon.js';
    import './test-world-editor.js';
    import './test-weapons.js';
    import './test-entity-manager.js';

    runAndExpose().then((r) => {
      document.getElementById('report').textContent =
        `passed=${r.passed} failed=${r.failed} total=${r.total} passRate=${r.passRate}%`;
    });
  </script>
</body>
</html>
