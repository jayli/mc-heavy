<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>mc-lite hanging_lamp faithful render</title><link rel="icon" href="data:,">
  <style>html, body { margin: 0; } canvas { display: block; }</style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.webgpu.js",
      "three/tsl": "/vendor/three/three.tsl.js",
      "three/webgpu": "/vendor/three/three.webgpu.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';

  // 忠实复现 mc-lite hanging_lamp：
  //   贴图  MaterialManager.js:1197-1220 textureGenerator（64×64 canvas）
  //   几何  ChunkConsolidation.js:216-227 geoHangingLamp
  //   材质  _createMaterial 情况2（MeshStandardNodeMaterial）
  //   渲染  Engine.js:157-158 ACESFilmicToneMapping + exposure 1.25
  function makeTexture(withPattern) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#aaa49a'; ctx.fillRect(0, 0, 64, 64);
    if (withPattern) {
      ctx.fillStyle = '#333333'; ctx.fillRect(30, 0, 4, 20);   // 绳图案
      ctx.fillStyle = '#FFE4B5'; ctx.fillRect(18, 20, 28, 28); // 灯体图案
      ctx.fillStyle = '#FFF5E6'; ctx.fillRect(24, 26, 16, 16); // 发光区
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(26, 28, 4, 4);   // 高光
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false; tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function makeLamp(tex, emissiveIntensity) {
    // _createMaterial 情况2：只传 map/transparent/opacity/side/alphaTest/emissive/emissiveIntensity
    const mat = new THREE.MeshStandardNodeMaterial({
      map: tex, transparent: true, opacity: 1, side: THREE.FrontSide,
      alphaTest: 0.1, emissive: '#FFE4B5', emissiveIntensity,
    });
    const rope = new THREE.CylinderGeometry(0.015, 0.015, 0.4, 8);
    rope.translate(0, 0.3, 0);
    const body = new THREE.BoxGeometry(0.3, 0.3, 0.3);
    const g = new THREE.Group();
    g.add(new THREE.Mesh(rope, mat));
    g.add(new THREE.Mesh(body, mat));
    return g;
  }

  async function run() {
    const renderer = new THREE.WebGPURenderer({ antialias: false });
    renderer.setSize(900, 400);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // Engine.js:157
    renderer.toneMappingExposure = 1.25;                // Engine.js:158

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x303038);
    scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // 满光照，diffuse 项可见

    // 三个样本：A = mc-lite 原样（emissive 0.8）
    //           B = 同几何但 emissive 0（只看贴图图案，用于验证 UV 是否含绳图案）
    //           C = 纯背景色贴图 + emissive 0（对照）
    const a = makeLamp(makeTexture(true), 0.8); a.position.set(-1.1, 0, 0); scene.add(a);
    const b = makeLamp(makeTexture(true), 0.0); b.position.set(0.0, 0, 0); scene.add(b);
    const c = makeLamp(makeTexture(false), 0.8); c.position.set(1.1, 0, 0); scene.add(c);

    const cam = new THREE.PerspectiveCamera(30, 900 / 400, 0.01, 20);
    cam.position.set(0, 0.15, 2.6);
    cam.lookAt(0, 0.15, 0);

    await renderer.renderAsync(scene, cam);
    window.__LAMP_READY__ = true;
  }
  run().catch((e) => { window.__LAMP_ERROR__ = String(e && e.stack || e); });
</script>
</body>
</html>
