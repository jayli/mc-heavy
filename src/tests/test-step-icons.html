<!doctype html>
<html><head><meta charset="utf-8"><title>台阶图标对照</title>
<style>
  body { background:#1a1a1a; color:#eee; font:13px monospace; margin:0; padding:16px; }
  h3 { margin:12px 0 6px; color:#ffcc66; }
  .row { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .cell { text-align:center; }
  .box { width:96px; height:96px; background:#8b8b8b; border:2px solid #fff;
         border-right-color:#373737; border-bottom-color:#373737;
         display:flex; justify-content:center; align-items:center; }
  .ico { width:64px; height:64px; image-rendering:pixelated; background-repeat:no-repeat; }
  .ico32 { width:32px; height:32px; image-rendering:pixelated; background-repeat:no-repeat; }
  .lbl { font-size:11px; margin-top:4px; color:#aaa; }
  .diff { color:#ff8866; }
</style>
</head><body>
<h2>台阶背包图标：现状（普通方块贴图）vs mc-lite 专用图标</h2>
<div id="out"></div>
<script type="module">
const atlasJson = await (await fetch('/assets/atlas.json')).json();
const ATLAS = '/assets/atlas.png';
const SIZE = atlasJson.size;

const CASES = [
  ['planks_step',              'planks_birch',              'Oak_Planks_step'],
  ['cobblestone_step',         'Cobblestone',               'Cobblestone_step'],
  ['cobblestone_step_updown',  'Cobblestone',               'Cobblestone_step_updown'],
  ['stone_diorite_step',       'stone_diorite',             'stone_diorite_step'],
];

function styleOf(tile, px) {
  const sx = px / tile.w, sy = px / tile.h;
  return `width:${px}px;height:${px}px;image-rendering:pixelated;background-repeat:no-repeat;`
    + `background-image:url('${ATLAS}');`
    + `background-size:${Math.round(SIZE*sx)}px ${Math.round(SIZE*sy)}px;`
    + `background-position:${-Math.round(tile.x*sx)}px ${-Math.round(tile.y*sy)}px;`;
}

const out = document.getElementById('out');
for (const [block, nowTile, iconTile] of CASES) {
  const h = document.createElement('h3');
  h.textContent = block;
  out.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';

  for (const [label, tname, px, cls] of [
    [`现状 ${nowTile}`, nowTile, 64, 'ico'],
    [`现状 32px（背包实际尺寸）`, nowTile, 32, 'ico32'],
    [`mc-lite ${iconTile}`, iconTile, 64, 'ico'],
    [`mc-lite 32px（背包实际尺寸）`, iconTile, 32, 'ico32'],
  ]) {
    const t = atlasJson.tiles[tname];
    const cell = document.createElement('div');
    cell.className = 'cell';
    const box = document.createElement('div');
    box.className = 'box';
    const d = document.createElement('div');
    d.className = cls;
    d.setAttribute('style', styleOf(t, px));
    box.appendChild(d);
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = label + (t ? '' : ' [MISSING]');
    cell.append(box, l);
    row.appendChild(cell);
  }
  out.appendChild(row);
}

// 其余 orphan tile 一并展示（栏杆/柱子/矿车等）
const h2 = document.createElement('h3');
h2.textContent = '其余未引用的 orphan tile（潜在同类问题）';
out.appendChild(h2);
const row2 = document.createElement('div');
row2.className = 'row';
for (const tname of ['Invicon_Minecart','handrail','handrailA','handrailB','pillar','pillar_horizontal','gold','leaves_original','turret']) {
  const t = atlasJson.tiles[tname];
  if (!t) continue;
  const cell = document.createElement('div');
  cell.className = 'cell';
  const box = document.createElement('div');
  box.className = 'box';
  const d = document.createElement('div');
  d.className = 'ico';
  d.setAttribute('style', styleOf(t, 64));
  box.appendChild(d);
  const l = document.createElement('div');
  l.className = 'lbl';
  l.textContent = `${tname} ${t.w}x${t.h}`;
  cell.append(box, l);
  row2.appendChild(cell);
}
out.appendChild(row2);
window.__ICON_PROBE_DONE__ = true;
</script>
</body></html>
