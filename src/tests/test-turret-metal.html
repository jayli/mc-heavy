<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>turret metal fixture</title><link rel="icon" href="data:,">
  <style>html, body { margin: 0; background: #000; }</style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/three.webgpu.js",
      "three/tsl": "../../vendor/three/three.tsl.js",
      "three/webgpu": "../../vendor/three/three.webgpu.js",
      "three/addons/": "../../vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { uniform } from 'three/tsl';
  import { TurretRenderer } from '../render/turret-renderer.js';
  import { loadTurretTopGeometry } from '../render/turret-top-geometry.js';

  // 炮管金属光泽的 Tier 4 夹具。
  //
  // ⚠️⚠️ **只留炮管，其余 8 个部件全部隐藏**：装甲现在是三档冷灰金属（v3.14），
  // 亮度与炮管同量级，混进统计会把炮管的亮度分布淹没
  // （与焰魔法阵「先藏掉自带同色的宿主」同一条教训）。
  //
  // ⚠️ **太阳方向用自建 uniform 而非 renderWorld 的**：本夹具没有体素世界，
  // 但注入路径与真实游戏一致（同一个 `sunDirection` 参数位）。真实游戏里传的是
  // `renderWorld.materials.dayNight.uSunDirection`，由 DayNight 每帧写入。
  //
  // 黑背景：统计时按「非近黑」筛出炮管像素，无需知道屏幕坐标。
  async function run() {
    const geo = await loadTurretTopGeometry();
    if (!geo) throw new Error('塔顶几何加载失败');
    const renderer = new THREE.WebGPURenderer({ antialias: true });
    renderer.setSize(760, 560);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const sunDir = uniform(new THREE.Vector3(0.5, 0.8, 0.3).normalize());
    const sunStr = uniform(1.0);
    const tr = new TurretRenderer({
      scene, maxActive: 1, topGeometry: geo,
      sunDirection: sunDir, sunStrength: sunStr,
    });

    /**
     * spec 调用：摆好太阳与相机，只渲染炮管。
     * @param {{camYaw:number, camPitch:number, dist:number, sun:number[], strength:number}} a
     */
    window.__TM_RENDER__ = (a) => {
      sunDir.value.set(a.sun[0], a.sun[1], a.sun[2]).normalize();
      sunStr.value = a.strength;
      tr.sync(new Map([['t', { position: [0, 0, 0], yaw: 0, pitch: 0 }]]));
      // sync 会把所有部件置 visible=true ⇒ 必须在其后再隐藏非炮管部件
      for (const k of Object.keys(tr.meshes)) tr.meshes[k].visible = (k === 'barrel');
      const cam = new THREE.PerspectiveCamera(45, 760 / 560, 0.05, 100);
      const cz = 2.5;   // 看向炮管中段（炮管 z ∈ [1.59, 3.50]）
      cam.position.set(
        a.dist * Math.cos(a.camPitch) * Math.sin(a.camYaw),
        a.dist * Math.sin(a.camPitch),
        cz + a.dist * Math.cos(a.camPitch) * Math.cos(a.camYaw),
      );
      cam.lookAt(0, 0, cz);
      renderer.render(scene, cam);
      renderer.render(scene, cam);   // 首帧可能在编译 shader
    };

    window.__TM_INFO__ = {
      geometryLoaded: !!geo,
      barrelMaterial: tr.meshes.barrel.material.type,
      hasColorNode: !!tr.meshes.barrel.material.colorNode,
      partCount: Object.keys(tr.meshes).length,
    };
    window.__TM_READY__ = true;
  }
  run().catch((e) => { window.__TM_ERROR__ = String(e?.stack || e); });
</script>
</body>
</html>
