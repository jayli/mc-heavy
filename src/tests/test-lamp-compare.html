<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>lamp compare fixture</title><link rel="icon" href="data:,">
  <style>html, body { margin: 0; } canvas { display: block; }</style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.webgpu.js",
      "three/tsl": "/vendor/three/three.tsl.js",
      "three/webgpu": "/vendor/three/three.webgpu.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { buildSectionMesh } from '../mesh/mesher.js';
  import { createRegistry } from '../voxel/block-registry.js';
  import { BLOCKS } from '../voxel/blocks-data.js';
  import { loadAtlas } from '../mesh/atlas-loader.js';

  // =========================================================================
  // 吊灯两侧对照（手动调试页，未注册进 src/tests/index.html 与 Playwright 套件）
  //
  // 左侧 = mc-lite 原样；右侧 = mc-heavy 当前实现（真实 mesher + atlas tile）。
  // **注意：自 v1.22 起两侧不再一致**——mc-heavy 已有意偏离 mc-lite（§4.3「吊灯 UV 分区」）：
  //   mc-lite：绳与灯体 UV 均 u/v∈[0,1] 全幅（灯面含绳图案、绳含灯体图案），emissive 加项
  //            把绳的深色冲淡到与灯体同亮（实测三样本 mc-lite 原样 ≡ 纯背景色贴图）。
  //   mc-heavy：绳只采绳图案区（单色深灰 #333333）且不吃 emissive；灯体只采灯体图案区
  //            （不含绳图案）且吃 emissive → 发光暖黄。
  // 故本页现在展示的是「偏离前 vs 偏离后」的差异，而非「是否忠实复刻」。
  // =========================================================================
  // 左侧：精确复现 mc-lite hanging_lamp
  //   贴图  = MaterialManager.js:1197-1220 textureGenerator（64×64 canvas）
  //   几何  = ChunkConsolidation.js:216-227 geoHangingLamp
  //   材质  = _createMaterial 情况2（MeshStandardNodeMaterial，无 color 字段）
  // =========================================================================
  function makeMcLiteLamp() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    // _createMaterial：def.color 且 fillBackground!==false → 先填背景色
    ctx.fillStyle = '#aaa49a'; ctx.fillRect(0, 0, 64, 64);
    // textureGenerator 逐行照抄
    ctx.fillStyle = '#333333'; ctx.fillRect(30, 0, 4, 20);
    ctx.fillStyle = '#FFE4B5'; ctx.fillRect(18, 20, 28, 28);
    ctx.fillStyle = '#FFF5E6'; ctx.fillRect(24, 26, 16, 16);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(26, 28, 4, 4);

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false; tex.colorSpace = THREE.SRGBColorSpace;

    // 材质：情况2 分支只传 map/transparent/opacity/side/alphaTest/emissive/emissiveIntensity
    const mat = new THREE.MeshStandardNodeMaterial({
      map: tex, transparent: true, opacity: 1, side: THREE.FrontSide,
      alphaTest: 0.1, emissive: '#FFE4B5', emissiveIntensity: 0.8,
    });

    // 几何：rope CylinderGeometry(0.015,0.015,0.4,8)+translate(0,0.3,0)；body Box 0.3³
    const rope = new THREE.CylinderGeometry(0.015, 0.015, 0.4, 8);
    rope.translate(0, 0.3, 0);
    const body = new THREE.BoxGeometry(0.3, 0.3, 0.3);

    const group = new THREE.Group();
    group.add(new THREE.Mesh(rope, mat));
    group.add(new THREE.Mesh(body, mat));
    return { group, mat, tex };
  }

  // =========================================================================
  // 右侧：mc-heavy 当前实现（真实 mesher + atlas tile）
  // =========================================================================
  async function makeMcHeavyLamp() {
    const reg = createRegistry();
    for (const def of BLOCKS) reg.register(def.name, def);
    reg.freeze();
    const { texture } = await loadAtlas();
    const atlasMeta = await (await fetch('/assets/atlas.json')).json();

    // 造一个 1 方块 section：中心放 hanging_lamp
    const id = reg.idOf('hanging_lamp');
    const size = 18 * 18 * 18;
    const data = new Uint16Array(size);
    const light = new Uint8Array(size);
    const m = new Uint8Array(size);
    const idx = 8 + 8 * 18 + 8 * 324; // halo 中心 (8,8,8)
    data[idx] = id;
    light[idx] = (15 << 4) | 15; // 满光照，排除光照变量干扰

    const out = buildSectionMesh(
      { data, light, meta: m, missing: false }, reg, atlasMeta, 0, 0, 0,
    );
    // hanging_lamp cullMode → cutout 通道
    const g = out.cutout;
    // AO 位设为 3（开阔）：mc-lite hanging_lamp isSolid:false → useAO=false，无 AO 调制。
    // 不设的话 mesher 默认 ao=0 → aoFactor 0.1，右侧会被压暗成干扰变量。
    for (let i = 0; i < g.packed.length; i++) {
      g.packed[i] = (g.packed[i] & ~(3 << 8)) | (3 << 8);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(g.uvs, 2));
    geo.setAttribute('packed', new THREE.Uint32BufferAttribute(g.packed, 1));
    geo.setIndex(new THREE.Uint32BufferAttribute(g.indices, 1));
    // mesher 发射 section 内局部坐标（lx+rx）：方块在 halo 中心 (8,8,8) → local (7,7,7)，
    // 块中心 (7.5,7.5,7.5)。平移 -7.5 令块中心落在原点，与 mc-lite 侧一致
    // （mc-lite 实例原点 = 块中心 `position.set(x+0.5,y+0.5,z+0.5)`）。
    geo.translate(-7.5, -7.5, -7.5);
    return { geo, texture, atlasMeta, id, verts: g.vertexCount };
  }

  async function run() {
    const renderer = new THREE.WebGPURenderer({ antialias: false });
    renderer.setSize(900, 420);
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202028);
    // 光照：mc-lite 真实场景有日光 → MeshStandardNodeMaterial 的 diffuse 项才非零。
    // 无光源时只剩 emissive 均匀加项，贴图图案被完全淹没（首次对照即此错误）。
    // AmbientLight 1.0 = 满光照，与 mc-heavy 侧 light=15/AO=3 的 shade=1.0 对齐。
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    // mc-lite Engine.js:157-158：ACESFilmicToneMapping + exposure 1.25（默认档）。
    // tone mapping 会改变 emissive 加项的最终呈现，必须照抄否则对照失真。
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    // ---- 左：mc-lite ----
    const lite = makeMcLiteLamp();
    lite.group.position.set(-0.9, 0, 0);
    scene.add(lite.group);

    // ---- 右：mc-heavy ----
    const heavy = await makeMcHeavyLamp();
    // 直接用生产材质（materials.js cutout 通道），避免手写 TSL 引入偏差
    const { createVoxelMaterials } = await import('../render/materials.js');
    const mats = createVoxelMaterials(heavy.texture);
    const mesh = new THREE.Mesh(heavy.geo, mats.cutout);
    mesh.position.set(0.9, 0, 0);
    scene.add(mesh);

    const cam = new THREE.PerspectiveCamera(35, 900 / 420, 0.01, 20);
    cam.position.set(0, 0.25, 3.2);
    cam.lookAt(0, 0.25, 0);

    await renderer.renderAsync(scene, cam);
    window.__LAMP_READY__ = true;
    heavy.geo.computeBoundingSphere();
    window.__LAMP_INFO__ = {
      heavyVerts: heavy.verts,
      tile: heavy.atlasMeta.tiles['procedural/hanging_lamp'],
      sceneChildren: scene.children.length,
      heavyAttrs: Object.keys(heavy.geo.attributes),
      heavyBSphere: heavy.geo.boundingSphere ? { r: heavy.geo.boundingSphere.radius, cx: heavy.geo.boundingSphere.center.x } : null,
      heavyPos: [mesh.position.x, mesh.position.y, mesh.position.z],
      camPos: [cam.position.x, cam.position.y, cam.position.z],
    };
  }
  run().catch((e) => { window.__LAMP_ERROR__ = String(e && e.stack || e); });
</script>
</body>
</html>
